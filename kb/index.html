<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Policy Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
<style>
/* Layout: search-first home with a slim lilac Knowledge Check strip; one long article per policy with a sticky section index;
   white study-set cards on a cool-gray canvas. Single light theme by design (Quizlet-style reference). */
:root {
  --iris: #4255ff;
  --ink: #282e3e;
  --indigo: #2e3856;
  --slate: #586380;
  --fog: #939bb4;
  --canvas: #f6f7fb;
  --paper: #ffffff;
  --lilac: #edefff;
  --border: #d9dde8;
  --p-cyan: #cdeef7;
  --p-magenta: #f8d5ea;
  --p-violet: #dbdfff;
  --p-peach: #ffe1cf;
  --ok: #1b7f55;
  --ok-wash: #e5f5ed;
  --bad: #b83247;
  --bad-wash: #fcebee;
  --sh-md: 0 4px 16px 0 rgba(40, 46, 62, .1);
  --sh-sm: 0 2px 4px 0 rgba(40, 46, 62, .1);
  --font: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  font-family: var(--font); font-size: 16px; line-height: 1.5; font-weight: 400;
  color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; color: var(--ink); text-wrap: balance; }
p { margin: 0; }
a { color: var(--iris); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--iris); outline-offset: 2px; }
.inner {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.muted { color: var(--slate); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.ic { flex: none; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--iris); color: #fff; border: 0; border-radius: 200px;
  padding: 10px 24px; font-weight: 600; font-size: 16px; line-height: 1.25;
  box-shadow: var(--sh-sm); text-decoration: none; white-space: nowrap;
}
a.btn { color: #fff; }
.btn:hover { background: #3447e8; text-decoration: none; }
.btn-sm { padding: 8px 16px; font-size: 14px; }
.btn-ghost, a.btn-ghost { background: transparent; color: var(--iris); border: 1px solid var(--iris); box-shadow: none; }
.btn-ghost:hover { background: var(--lilac); }
.btn:disabled { background: var(--border); color: var(--fog); box-shadow: none; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--iris); font-size: inherit; }
.link:hover { text-decoration: underline; }

/* ---------- Hero / sections ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
.chip { background: var(--paper); border: 1px solid var(--border); border-radius: 200px; padding: 6px 14px; font-size: 14px; color: var(--ink); }
.chip:hover { border-color: var(--iris); color: var(--iris); text-decoration: none; }
.section { padding-block: 40px 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.sec-head h2 { font-size: 24px; line-height: 32px; }
.sec-head p { color: var(--slate); font-size: 14px; }
.gap80 { height: 40px; }

/* feature category cards */
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.fcard { border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 16px; color: var(--ink); min-width: 0; }
.fcard:hover { text-decoration: none; box-shadow: var(--sh-md); }
.fcard.cyan { background: var(--p-cyan); } .fcard.magenta { background: var(--p-magenta); }
.fcard.violet { background: var(--p-violet); } .fcard.peach { background: var(--p-peach); }
.fcard .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 4px 4px 0; }
.fcard h3 { font-size: 20px; line-height: 28px; font-weight: 700; }
.fcard .cnt { font-size: 14px; color: var(--indigo); }
.fcard .panel { background: var(--paper); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.fcard .panel .li { font-size: 14px; line-height: 20px; color: var(--ink); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.fcard .panel .li:last-child { border-bottom: 0; padding-bottom: 0; }
.fcard .panel .more { font-size: 14px; color: var(--iris); font-weight: 600; margin-top: auto; }

/* study-set style cards */
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.scard { display: flex; flex-direction: column; gap: 8px; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--ink); min-width: 0; }
.scard:hover { text-decoration: none; border-color: var(--iris); box-shadow: var(--sh-md); }
.scard h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
.scard p { font-size: 14px; line-height: 20px; color: var(--slate); }
.scard .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
.badge { font-size: 12px; line-height: 18px; color: var(--slate); background: var(--canvas); border-radius: 200px; padding: 0 10px; }
.badge.ic-b { display: inline-flex; gap: 4px; align-items: center; }
.scard .ico { color: var(--iris); }

/* footer */
.footer { padding-block: 48px 40px; margin-top: 40px; }
.fcols { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; }
.fcols h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.fcols a, .fcols p { display: block; font-size: 14px; color: var(--slate); padding-block: 4px; }
.fcols a:hover { color: var(--iris); }

/* ---------- Category page ---------- */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--slate); padding-block: 24px 16px; }
.crumbs a { color: var(--slate); } .crumbs a:hover { color: var(--iris); }
.chead { border-radius: 24px; padding: 32px; display: flex; gap: 24px; align-items: flex-start; }
.chead.cyan { background: var(--p-cyan); } .chead.magenta { background: var(--p-magenta); }
.chead.violet { background: var(--p-violet); } .chead.peach { background: var(--p-peach); }
.chead .cico { width: 56px; height: 56px; border-radius: 8px; background: var(--paper); display: grid; place-items: center; color: var(--ink); flex: none; }
.chead h1 { font-size: 32px; line-height: 41px; }
.chead p { margin-top: 4px; color: var(--indigo); max-width: 60ch; }
.chead .src { margin-top: 12px; font-size: 14px; color: var(--indigo); }

/* ---------- Article page ---------- */
.article h1 { font-size: 32px; line-height: 41px; }
.ameta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--slate); }
.quick { background: var(--lilac); border-radius: 8px; padding: 16px; margin-top: 24px; }
.quick .qh { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--slate); margin-bottom: 12px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.qtile { background: var(--paper); border-radius: 8px; padding: 12px 16px; box-shadow: var(--sh-sm); min-width: 0; }
.qtile .ql { font-size: 12px; color: var(--slate); }
.qtile .qv { font-size: 24px; line-height: 32px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.qtile .qn { font-size: 13px; line-height: 18px; color: var(--slate); margin-top: 2px; }
.body > * + * { margin-top: 16px; }
.body h2 { font-size: 24px; line-height: 32px; margin-top: 40px; scroll-margin-top: 130px; }
.body p { color: var(--indigo); max-width: 70ch; }
.card { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
.cards { display: grid; gap: 16px; }
.cards.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards h3 { font-size: 16px; line-height: 24px; }
.cards p { font-size: 14px; line-height: 20px; color: var(--slate); margin-top: 4px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { display: flex; gap: 16px; align-items: flex-start; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 16px; counter-increment: s; }
.steps li::before { content: counter(s); flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--lilac); color: var(--iris); font-weight: 600; display: grid; place-items: center; }
.steps h3 { font-size: 16px; line-height: 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.steps p { font-size: 14px; line-height: 20px; color: var(--slate); margin-top: 2px; }
.callout { display: flex; gap: 12px; background: var(--lilac); border-radius: 8px; padding: 16px; }
.callout .ci { color: var(--iris); flex: none; margin-top: 2px; }
.callout h4 { font-size: 16px; line-height: 24px; }
.callout p { color: var(--indigo); font-size: 15px; margin-top: 2px; }
.tablewrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 20px; }
th, td { text-align: left; vertical-align: top; padding: 12px 16px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; background: var(--canvas); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; white-space: nowrap; }
.say { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.say.one { grid-template-columns: minmax(0, 1fr); }
.say .sc { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; font-size: 15px; color: var(--indigo); }
.say .sl { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border-radius: 200px; padding: 2px 10px; margin-bottom: 8px; }
.say .good .sl { background: var(--ok-wash); color: var(--ok); }
.say .bad .sl { background: var(--bad-wash); color: var(--bad); }
.pillrow { display: flex; flex-wrap: wrap; gap: 8px; }
.pillrow span { background: var(--paper); border: 1px solid var(--border); border-radius: 200px; padding: 6px 14px; font-size: 14px; }

/* timeline */
.tl { padding: 24px 24px 8px; }
.tl-top, .tl-bot { position: relative; height: 64px; }
.tl-track { position: relative; height: 8px; border-radius: 4px; background: var(--border); }
.tl-seg { position: absolute; top: 0; bottom: 0; }
.tl-seg.a { background: var(--iris); border-radius: 4px 0 0 4px; }
.tl-seg.b { background: var(--fog); }
.tl-seg.c { background: var(--border); }
.tl-seg.d { background: var(--ink); border-radius: 0 4px 4px 0; }
.tl-dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
.tl-lb { position: absolute; width: 88px; font-size: 12px; line-height: 16px; color: var(--slate); }
.tl-lb b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; }
.tl-top .tl-lb { bottom: 10px; } .tl-bot .tl-lb { top: 10px; }
.tl-lb.l { text-align: left; } .tl-lb.c { text-align: center; transform: translateX(-50%); } .tl-lb.r { text-align: right; transform: translateX(-100%); }
.tl-key { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--slate); padding: 4px 0 12px; }
.tl-key span::before { content: ""; display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--k); }

/* flow */
.flow { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--sh-md); overflow: hidden; }
.flow-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--canvas); border-bottom: 1px solid var(--border); font-size: 14px; color: var(--slate); }
.flow-h b { color: var(--ink); font-weight: 600; }
.flow-b { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.trail { display: grid; gap: 4px; font-size: 13px; color: var(--slate); }
.trail div::before { content: "✓ "; color: var(--iris); }
.flow h3 { font-size: 20px; line-height: 28px; }
.flow .hint { color: var(--slate); font-size: 14px; margin-top: -8px; }
.fopts { display: grid; gap: 8px; }
.fopt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 15px; }
.fopt:hover { border-color: var(--iris); background: var(--lilac); }
.fopt .ic { color: var(--iris); }
.fres { background: var(--lilac); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fres .tag { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--slate); }
.fres ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--indigo); }
.fres .note { font-size: 14px; color: var(--indigo); display: flex; gap: 8px; }
.fres .note .ic { color: var(--iris); margin-top: 2px; }
.flow-f { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 14px; }

/* replies */
.reply { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.reply.flash { border-color: var(--iris); box-shadow: 0 0 0 3px var(--lilac); }
.reply-top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; padding: 16px; }
.reply-top h4 { font-size: 16px; line-height: 24px; }
.reply-top p { font-size: 14px; line-height: 20px; color: var(--slate); margin-top: 2px; }
.reply-body { margin: 0; padding: 16px; background: var(--canvas); border-top: 1px solid var(--border); white-space: pre-wrap; font: inherit; font-size: 14px; line-height: 22px; color: var(--indigo); overflow-wrap: anywhere; }
.replies { display: grid; gap: 16px; }
.fres .reply { background: var(--paper); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.fchip { background: var(--paper); border: 1px solid var(--border); border-radius: 200px; padding: 6px 14px; font-size: 14px; }
.fchip:hover { border-color: var(--iris); }
.fchip.on { background: var(--iris); border-color: var(--iris); color: #fff; font-weight: 600; }
.page-h { padding-block: 24px 24px; }
.page-h h1 { font-size: 32px; line-height: 41px; }
.page-h p { color: var(--slate); margin-top: 4px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 200px; padding: 10px 20px; font-size: 14px; box-shadow: var(--sh-md); z-index: 60; max-width: calc(100% - 32px); }

/* ---------- Quiz ---------- */
.quiz { max-width: 820px; margin: 0 auto; padding-bottom: 24px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 14px; color: var(--slate); margin-bottom: 8px; }
.qprog { display: flex; gap: 4px; margin-bottom: 24px; }
.qprog i { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
.qprog i.done { background: var(--iris); }
.qprog i.cur { background: var(--slate); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.qmeta .badge { background: var(--lilac); color: var(--indigo); }
.quiz h2 { font-size: 24px; line-height: 32px; }
.qintro { color: var(--indigo); margin-top: 8px; }
.tk { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--sh-md); overflow: hidden; margin-top: 16px; }
.tk-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: var(--canvas); border-bottom: 1px solid var(--border); font-size: 14px; }
.tk-chan { background: var(--paper); border: 1px solid var(--border); border-radius: 200px; padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--indigo); }
.tk-av { width: 28px; height: 28px; border-radius: 50%; background: var(--lilac); color: var(--iris); font-weight: 600; font-size: 13px; display: grid; place-items: center; }
.tk-meta { color: var(--slate); margin-left: auto; font-size: 13px; }
.tk-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bub { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub small { display: block; font-size: 12px; font-weight: 600; opacity: .75; margin-bottom: 2px; }
.bub.cust { background: var(--canvas); border-bottom-left-radius: 4px; align-self: flex-start; }
.bub.agent { background: var(--iris); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.qprompt { font-weight: 600; margin-top: 24px; }
.opts { display: grid; gap: 8px; margin-top: 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 15px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--iris); background: var(--lilac); }
.opt .k { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--lilac); color: var(--iris); font-weight: 600; display: grid; place-items: center; }
.opt.ok { border-color: var(--ok); background: var(--ok-wash); }
.opt.bad { border-color: var(--bad); background: var(--bad-wash); }
.opt.ok .k { background: var(--ok); color: #fff; } .opt.bad .k { background: var(--bad); color: #fff; }
.opt.dim { opacity: .6; }
.opt:disabled { cursor: default; }
.fb { margin-top: 16px; border-radius: 8px; padding: 16px; background: var(--lilac); display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: var(--ok-wash); } .fb.bad { background: var(--bad-wash); }
.fb h4 { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.fb.ok h4 { color: var(--ok); } .fb.bad h4 { color: var(--bad); }
.fb p { color: var(--indigo); font-size: 15px; }
.qnext { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 16px; }
.sentlist { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 16px; display: grid; gap: 4px; }
.sent { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 22px; }
.sent:hover:not(:disabled) { background: var(--canvas); }
.sent.sel { background: var(--lilac); border-color: var(--iris); }
.sent.ok { background: var(--ok-wash); border-color: var(--ok); }
.sent.bad { background: var(--bad-wash); border-color: var(--bad); }
.sent.miss { border: 1px dashed var(--ok); }
.sent .tg { float: right; font-size: 12px; font-weight: 600; margin-left: 8px; }
.sent:disabled { cursor: default; }
.slots { display: grid; gap: 8px; margin-top: 16px; }
.slot { display: flex; gap: 12px; align-items: center; min-height: 52px; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; background: var(--paper); font-size: 15px; text-align: left; width: 100%; }
.slot .n { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--canvas); color: var(--slate); font-weight: 600; display: grid; place-items: center; }
.slot.fill { border-style: solid; border-color: var(--iris); background: var(--lilac); }
.slot.fill .n { background: var(--iris); color: #fff; }
.slot.ok { border-color: var(--ok); background: var(--ok-wash); } .slot.ok .n { background: var(--ok); color: #fff; }
.slot.bad { border-color: var(--bad); background: var(--bad-wash); } .slot.bad .n { background: var(--bad); color: #fff; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.pchip { background: var(--paper); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 20px; text-align: left; }

function stem(w) {
  if (/^\d/.test(w)) return w;
  if (w.length < 4) return w;
  let s = w;
  if (s.endsWith('ies') && s.length > 4) s = s.slice(0, -3) + 'y';
  else if (s.endsWith('sses')) s = s.slice(0, -2);
  else if (s.endsWith('ied') && s.length > 4) s = s.slice(0, -3) + 'y';
  else if (s.endsWith('ing') && s.length > 5) s = s.slice(0, -3);
  else if (s.endsWith('ed') && s.length > 4) s = s.slice(0, -2);
  else if (/(ch|sh|x|z|ss)es$/.test(s) && s.length > 4) s = s.slice(0, -2);
  else if (s.endsWith('s') && !s.endsWith('ss') && !s.endsWith('us') && s.length > 3) s = s.slice(0, -1);
  if (s.endsWith('ment') && s.length > 7) s = s.slice(0, -4);
  if (s.length > 4 && /(.)\1$/.test(s) && !/(ss|ll)$/.test(s)) s = s.slice(0, -1);
  if (s.length > 4 && s.endsWith('e')) s = s.slice(0, -1);
  return s;
}

function normText(s) {

function pieces(blocks) {
  const out = [];

    if (v == null) return;
    if (typeof v === 'string') { if (v.trim()) out.push(v.trim()); return; }
    if (Array.isArray(v)) { const strs = v.filter(x => typeof x === 'string'); if (strs.length === v.length) { const j = strs.filter(Boolean).join('. '); if (j) out.push(j); } else v.forEach(walk); return; }
    if (typeof v === 'object') {

    }

  c.bt.forEach(t => { c.fb[t] = (c.fb[t] || 0) + 1; });

/* Rebuild the whole index. Called at load and again whenever live edits change the content. */
function buildIndex() {

  POLICIES.forEach(p => {

    const seen = new Set([].concat(c.tt, c.kt, c.bt));
    seen.forEach(t => { DF[t] = (DF[t] || 0) + 1; });
  });

function osa(a, b) {
  const al = a.length, bl = b.length; if (!al) return bl; if (!bl) return al;
  const d = []; for (let i = 0; i <= al; i++) { d[i] = [i]; } for (let j = 0; j <= bl; j++) d[0][j] = j;
  for (let i = 1; i <= al; i++) for (let j = 1; j <= bl; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[al][bl];
}

/* ---------- query ---------- */
function altsFor(t, isLast) {
  const out = [];
  if (DF[t]) out.push({ term: t, w: 1 });
  const num = /^\d/.test(t);
  if (!num && t.length >= 3 && (isLast || !DF[t])) {
    const pre = VOCAB.filter(v => v !== t && v.startsWith(t)).sort((a, b) => DF[b] - DF[a]).slice(0, 10);
    pre.forEach(v => out.push({ term: v, w: DF[t] ? .5 : .75 }));
  }
  if (!out.length && !num && t.length >= 5) {
    const lim = t.length >= 8 ? 2 : 1;
    FUZ.forEach(f => { const v = f[0]; if (Math.abs(v.length - t.length) <= lim && v.length >= 4 && DF[f[1]] && osa(v, t) <= lim && !out.some(o => o.term === f[1])) out.push({ term: f[1], w: .6 }); });
  }

}

function dayIntent(raw, tk) {

  if (!m) return null;

function yearIntent(raw, tk) {
  const s = normText(raw);
  const m = s.match(/(\d+(?:\.\d+)?)\s*(year|years|yr|yrs)\b/);
  if (!m) return null;
  const y = +m[1];
  if (tk.some(t => ['return', 'refund', 'verify', 'gdpr'].includes(t))) return null;
  if (y > 3) return { faq: 'q-war-after3', label: `${m[1]} years old` };

function scoreChunk(c, q) {
  let s = 0, matchedW = 0;
  for (const t of q.items) {
    let best = 0;
    for (const a of t.alts) {
      const ft = c.ft[a.term] || 0, fk = c.fk[a.term] || 0, fb = c.fb[a.term] || 0;
      if (!ft && !fk && !fb) continue;
      let v = 0;
      if (ft) v += 5;
      if (fk) v += 4;
      if (fb) v += 1.5 * (fb / (fb + 1.2));
      best = Math.max(best, v * a.w * idf(a.term));
    }
    if (best > 0) { s += best; matchedW += t.w; }
  }
  if (!s) return 0;
  const cov = matchedW / q.totalW;
  s *= (0.25 + 0.75 * cov * cov);
  for (let i = 0; i < q.seq.length - 1; i++) {
    const bg = q.seq[i] + ' ' + q.seq[i + 1];
    if (c.bg.has(bg)) s += (idf(q.seq[i]) + idf(q.seq[i + 1])) * 1.4;
  }
  return s * (c.kind === 'faq' ? 1.3 : c.kind === 'reply' ? .85 : (c.mult || 1));

function prepare(raw) {
  const tk = toks(raw);
  const uniq = [...new Set(tk)];
  const items = [];
  uniq.forEach(t => {
    const isLast = t === tk[tk.length - 1];
    const alts = altsFor(t, isLast);
    if (!alts.length) return;
    const top = alts.reduce((m, a) => Math.max(m, idf(a.term) * a.w), 0);
    items.push({ t, alts, w: Math.max(.3, Math.min(1.5, top / 2)) });
  });
  const known = new Set(items.map(i => i.t));
  const seq = tk.filter(t => known.has(t));
  return { raw, tk, items, seq, totalW: items.reduce((a, i) => a + i.w, 0) || 1, terms: new Set(items.flatMap(i => i.alts.map(a => a.term))) };
}

function bestSentence(pcs, q) {

    p.split(/(?<=[.!?])\s+/).forEach(sn => {

      q.terms.forEach(t => { if (tt.has(t)) n++; });
      if (n > bs) { bs = n; best = sn; }
    });
  });
  return best;
}

function search(raw, limit) {
  limit = limit || 8;

  const dI = dayIntent(raw, q.tk) || yearIntent(raw, q.tk);
  const bySec = {};
  CHUNKS.forEach(c => {
    let s = scoreChunk(c, q);
    if (dI && dI.faq && c.kind === 'faq' && c.id === dI.faq) s = Math.max(s, 1) * 5 + 1000;
    if (!s) return;
    const g = bySec[c.sec] || (bySec[c.sec] = { sec: c.sec, pol: c.pol, list: [] });
    g.list.push({ c, s });
  });
  const res = Object.values(bySec).map(g => {
    g.list.sort((a, b) => b.s - a.s);
    const top = g.list[0];
    const score = top.s + .25 * (g.list[1] ? g.list[1].s : 0) + .1 * (g.list[2] ? g.list[2].s : 0);
    const r = { sec: g.sec, pol: g.pol, score, kind: top.c.kind, label: null, faqId: null, replyId: null, snippet: '', note: '' };
    if (top.c.kind === 'faq') { r.faqId = top.c.id; r.snippet = top.c.answer; r.question = top.c.title; if (dI && dI.faq === top.c.id) r.label = dI.label; }
    else if (top.c.kind === 'reply') { r.replyId = top.c.id; r.snippet = `Reply: ${top.c.title}. ${top.c.when}`; }
    else {

      const fq = g.list.find(x => x.c.kind === 'faq');

    return r;
  });

  res.terms = q.terms;
  const out = res.slice(0, limit);
  out.terms = q.terms; out.intent = dI;
  return out;
}

function bestKey() { return 'kb-check-' + CHECK.month.replace(/\s+/g, '-'); }

const trunc = (s, n) => { s = String(s); if (s.length <= n) return s; const c = s.slice(0, n); return c.slice(0, c.lastIndexOf(' ') > 60 ? c.lastIndexOf(' ') : n) + '…'; };
function hl(text, terms) {
  return String(text).split(/([A-Za-z0-9€%’']+)/).map(p => {
    if (/^[A-Za-z0-9€%’']+$/.test(p)) { const st = wordStem(p); if (st && terms && terms.has(st)) return '<mark>' + esc(p) + '</mark>'; }
    return esc(p);
  }).join('');
}

/* ---------- quiz ---------- */
const QS = { i: 0, phase: 'intro', res: [], sub: null };
const TYPE_LABEL = { live: 'Live ticket', choice: 'Pick the best answer', spot: 'Spot the slip', order: 'Put in order', multi: 'Select all that apply', match: 'Match' };
function initSub() {
  const q = QUIZ[QS.i];
  if (q.type === 'live') QS.sub = { step: 0, log: [] };
  else if (q.type === 'choice') QS.sub = { chosen: null, ok: false };
  else if (q.type === 'spot' || q.type === 'multi') QS.sub = { sel: [], checked: false, ok: false };
  else if (q.type === 'order') QS.sub = { seq: [], checked: false, ok: false };

/* ---------- routing ---------- */

   Editors (the owner and anyone given Editor access) get an "Edit site" button. Every edit is saved to the shared
   database (collection "kb") and layered on top of the content in policies.js / legacy.js, so it is live for every
   viewer straight away, with no republish. "Reset to original" deletes the edit and the built-in text shows again.

   Documents in "kb":   s~<sectionId>  one edited or new section        o~<policyId>  section order + removed ids
                        f~<policyId>   common questions                 h~<policyId>  title, intro, source, four figures
                        r~<replyId>    one reply (or {deleted:true})    check         monthly announcement
                        quiz           all quiz questions               popular       Most used section ids
                        asks           example questions under search                                                   */
var LIVE = (() => {
  const clone = x => JSON.parse(JSON.stringify(x));
  const BASE = { replies: clone(REPLIES), quiz: clone(QUIZ), check: clone(CHECK), popular: POPULAR.slice(), asks: ASK_EXAMPLES.slice(), pol: {} };
  POLICIES.forEach(p => { BASE.pol[p.id] = clone({ name: p.name, blurb: p.blurb, source: p.source, tiles: p.tiles, sections: p.sections, faq: p.faq }); });

  let DB = null, OV = {}, lastSig = '[]', pending = false, SES = null, dirty = false, saving = false;
  const rid = () => 'x' + Math.random().toString(36).slice(2, 8);
  const parse = d => { try { return d && typeof d.data === 'string' ? JSON.parse(d.data) : null; } catch (e) { return null; } };
  const parseArr = s => { try { const v = JSON.parse(s); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
  const str = (v, d) => (typeof v === 'string' ? v : d == null ? '' : d);

  /* ---------- layer the saved edits over the built-in content ---------- */
  function normSec(s) {
    s.id = str(s.id); s.title = str(s.title, 'Untitled'); s.sum = str(s.sum); s.kw = str(s.kw); s.lead = str(s.lead);
    if (s.part != null) s.part = str(s.part);
    s.blocks = Array.isArray(s.blocks) ? s.blocks.filter(b => b && typeof b === 'object') : [];
    return s;
  }
  function applyAll(ov) {
    POLICIES.forEach(p => {
      const b = clone(BASE.pol[p.id]);
      try {
        const hv = parse(ov['h~' + p.id]);
        if (hv) {
          ['name', 'blurb', 'source'].forEach(k => { if (typeof hv[k] === 'string' && hv[k].trim()) b[k] = hv[k]; });
          if (Array.isArray(hv.tiles) && hv.tiles.length) b.tiles = hv.tiles.filter(Array.isArray).map(t => [str(t[0]), str(t[1]), str(t[2])]);
        }
        const fv = parse(ov['f~' + p.id]);
        if (Array.isArray(fv)) b.faq = fv.filter(f => f && typeof f === 'object').map(f => ({ id: str(f.id, rid()), sec: str(f.sec), q: str(f.q), a: str(f.a), kw: str(f.kw) }));
        let secs = b.sections;
        Object.keys(ov).forEach(k => {
          if (k.slice(0, 2) !== 's~' || ov[k].pol !== p.id) return;
          const sv = parse(ov[k]); if (!sv || !sv.id) return;
          const i = secs.findIndex(s => s.id === sv.id);
          if (i >= 0) secs[i] = sv; else secs.push(sv);

        const o = ov['o~' + p.id];
        if (o) {
          const order = parseArr(o.order), removed = parseArr(o.removed);
          const idx = id => { const i = order.indexOf(id); return i < 0 ? 1e6 : i; };
          secs = secs.filter(s => !removed.includes(s.id)).map((s, i) => [s, i]).sort((x, y) => (idx(x[0].id) - idx(y[0].id)) || x[1] - y[1]).map(x => x[0]);

    });
    Object.keys(REPLIES).forEach(k => { delete REPLIES[k]; });
    Object.assign(REPLIES, clone(BASE.replies));
    Object.keys(ov).forEach(k => {
      if (k.slice(0, 2) !== 'r~') return;
      const id = k.slice(2);
      if (ov[k].deleted) { delete REPLIES[id]; return; }

      if (rv && rv.title && typeof rv.text === 'string') REPLIES[id] = { cat: str(rv.cat, 'returns'), article: str(rv.article), title: str(rv.title), when: str(rv.when), text: rv.text };
    });

    const pv = parse(ov.popular);
    POPULAR.splice(0, POPULAR.length, ...(Array.isArray(pv) ? pv.filter(x => typeof x === 'string') : BASE.popular));
    const av = parse(ov.asks);
    ASK_EXAMPLES.splice(0, ASK_EXAMPLES.length, ...(Array.isArray(av) ? av.filter(x => typeof x === 'string' && x.trim()) : BASE.asks));

  const sigOf = ov => JSON.stringify(Object.keys(ov).sort().map(k => [k, Object.keys(ov[k] || {}).sort().map(f => f + '=' + JSON.stringify(ov[k][f]))]));

  function beforeRender() { if (pending && !(state.route === 'quiz' && QS.phase === 'q')) { pending = false; applyAll(OV); } }

  const J = JSON.stringify;

  /* ---------- field labels ---------- */
  const LBL = { title: 'Title', sum: 'Short summary (shown on cards and in search results)', kw: 'Search keywords (not shown to agents, they help search find this)', lead: 'Intro paragraph', part: 'Menu group', x: 'Text', h: 'Heading', k: 'Style', cols: 'Columns', q: 'Question', a: 'Answer', sec: 'Links to section', when: 'When to use it', text: 'Reply text', cat: 'Policy', article: 'Section it links to', name: 'Policy name', blurb: 'Intro', source: 'Source document name', month: 'Month', announced: 'Announcement line', deadline: 'Due date', topic: 'Policy', intro: 'Intro', customer: 'Customer message', prompt: 'Question to the agent', explain: 'Explanation shown after answering', reactOk: 'Customer reaction when right', reactBad: 'Customer reaction when wrong', chan: 'Channel', who: 'Customer name', meta: 'Ticket detail', ok: 'This is the correct answer', good: 'Say this', bad: 'Not this', head: 'Table header', rows: 'Rows', items: 'Items', steps: 'Steps', options: 'Options', sentences: 'Sentences', wrong: 'Wrong sentence (its number, first = 0)', shown: 'Starting order (number of the correct step, first = 0)', correct: 'Correct chip (its number, first = 0)', answers: 'Correct option for each item (its number, first = 0)', chips: 'Chips', ticket: 'Ticket', tiles: 'The four figures', blocks: 'Content', t: 'Text', faq: 'Questions' };
  const humanize = k => String(k).replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
  const BT = { p: 'Paragraph', h3: 'Heading', ul: 'Bullet list', steps: 'Steps', cards: 'Cards', callout: 'Callout box', table: 'Table', say: 'Say it like this', chips: 'Pill row', cases: 'Quick cases', timeline: 'Timeline (built in)', flow: 'Decision flow (built in)' };
  const TUP = { steps: ['Step', 'Details', 'Tag (optional)'], cards: ['Card title', 'Card text'], cases: ['Situation', 'Answer'], tiles: ['Label', 'Big figure', 'Small note'] };
  const SHORT = new Set(['title', 'part', 'q', 'name', 'source', 'month', 'announced', 'deadline', 'chan', 'who', 'meta', 'h', 'prompt', 'customer_', 'reactOk', 'reactBad']);
  const HIDE = new Set(['id', 'sw', 't', 'optStyle']);
  const KINDS = [['info', 'Info'], ['tip', 'Tip'], ['warn', 'Warning'], ['rule', 'Rule (dark)']];
  const BLOCKS = [
    ['p', 'Paragraph', () => ({ t: 'p', x: '' })], ['h3', 'Heading', () => ({ t: 'h3', x: '' })], ['ul', 'Bullet list', () => ({ t: 'ul', items: [''] })],
    ['steps', 'Steps', () => ({ t: 'steps', items: [['', '', '']] })], ['cards', 'Cards', () => ({ t: 'cards', cols: 2, items: [['', '']] })],
    ['callout', 'Callout box', () => ({ t: 'callout', k: 'info', h: '', x: '' })], ['table', 'Table', () => ({ t: 'table', head: ['', ''], rows: [['', '']] })],
    ['say', 'Say it like this', () => ({ t: 'say', good: { h: 'Say this', x: '' }, bad: { h: 'Not this', x: '' } })], ['chips', 'Pill row', () => ({ t: 'chips', items: [''] })], ['cases', 'Quick cases', () => ({ t: 'cases', items: [['', '']] })]

  /* ---------- tree editor ---------- */
  const pget = (o, path) => path.split('/').filter(x => x !== '').reduce((a, k) => (a == null ? a : a[k]), o);

  }
  const secOptions = sel => POLICIES.map(p => `<optgroup label="${esc(p.name)}">${p.sections.map(s => `<option value="${esc(s.id)}"${s.id === sel ? ' selected' : ''}>${esc(s.title)}</option>`).join('')}<option value="${esc(p.id)}-faq"${sel === p.id + '-faq' ? ' selected' : ''}>Common questions (${esc(p.short || p.name)})</option></optgroup>`).join('');

  }

    } else if (allStr || allNum) {

  /* ---------- drawer ---------- */

  /* ---------- openers ---------- */
  function normSteps(o) { // steps tuples: drop an empty third cell
    const walk = v => { if (Array.isArray(v)) v.forEach(walk); else if (v && typeof v === 'object') { if (v.t === 'steps' && Array.isArray(v.items)) v.items = v.items.map(it => { it = it.slice(); while (it.length > 2 && !it[it.length - 1]) it.pop(); return it; }); Object.keys(v).forEach(k => walk(v[k])); } };

  function openSection(id, isNew, pid, afterIdx) {
    let s, p;
    if (isNew) {
      p = POLS[pid];

      s = { id: rid(), title: 'New section', sum: '', kw: '', lead: '', part: nb && nb.part || undefined, blocks: [{ t: 'p', x: '' }] };

    } else { p = SEC[id].p; s = clone(SEC[id].s); }
    const W = prepSteps(clone(s));
    delete W.sw; // internal search weight stays as it was
    const sw = s.sw;
    openEditor({
      kind: 'sec', title: isNew ? 'New section' : 'Edit section', sub: p.name + (isNew ? ' · appears in the menu and in search once saved' : ''), W, bt: undefined,
      docId: isNew ? null : 's~' + s.id,
      validate: W2 => { if (!req(W2, ['title'])) return 'Give the section a title.'; try { const t = Object.assign({}, W2); sectionHTML(p, normSec(clone(t)), 1, true); } catch (e) { return 'Something in this section is incomplete (' + e.message + ').'; } return null; },
      save: async W2 => {
        const out = normSteps(clone(W2)); out.id = s.id; if (sw != null) out.sw = sw;
        await commit('s~' + s.id, { pol: p.id, data: J(out) });
        if (isNew) {
          const order = curOrder(p.id); const at = afterIdx >= 0 ? afterIdx + 1 : order.length;
          order.splice(at, 0, s.id); await saveOrder(p.id, order, curRemoved(p.id));
        }
      },
      reset: async () => { await uncommit('s~' + s.id); }
    });
  }
  function openFaq(pid) {
    const p = POLS[pid];
    openEditor({
      kind: 'faq', title: 'Edit common questions', sub: p.name, W: clone(p.faq), ctx: { key: 'faq' }, docId: 'f~' + pid,
      validate: W2 => (W2.every(f => req(f, ['q', 'a'])) ? null : 'Every question needs a question and an answer.'),
      save: async W2 => { await commit('f~' + pid, { data: J(W2.map(f => ({ id: f.id || rid(), sec: f.sec, q: f.q, a: f.a, kw: f.kw || '' }))) }); }
    });
  }
  function openPol(pid) {
    const p = POLS[pid];
    openEditor({
      kind: 'pol', title: 'Edit title, intro and figures', sub: p.name, W: clone({ name: p.name, blurb: p.blurb, source: p.source, tiles: p.tiles }), docId: 'h~' + pid,
      note: 'The four figures sit in boxes under the title. Keep the big figure short.',
      validate: W2 => (req(W2, ['name', 'blurb']) && W2.tiles.length ? null : 'Name, intro and at least one figure are required.'),
      save: async W2 => { await commit('h~' + pid, { data: J(W2) }); }
    });
  }
  function openReply(id) {
    const r = REPLIES[id];
    openEditor({
      kind: 'reply', title: 'Edit reply', sub: r.title, W: clone({ cat: r.cat, article: r.article, title: r.title, when: r.when, text: r.text }), docId: 'r~' + id,
      note: 'Keep customer details in [square brackets] so agents know what to fill in.',
      validate: W2 => (req(W2, ['title', 'text']) ? null : 'A reply needs a title and the reply text.'),
      save: async W2 => { await commit('r~' + id, { data: J(W2) }); },
      reset: async () => { await uncommit('r~' + id); },
      del: { label: 'Delete this reply', run: async () => { if (BASE.replies[id]) await commit('r~' + id, { deleted: true }); else await uncommit('r~' + id); } }
    });
  }
  function openNewReply(cat) {
    const pid = POLS[cat] ? cat : POLICIES[0].id, id = rid();
    openEditor({
      kind: 'newreply', title: 'Add a reply', sub: 'It shows in Replies and under the section you pick', W: { cat: pid, article: POLS[pid].sections[0].id, title: '', when: '', text: '' },
      note: 'Keep customer details in [square brackets] so agents know what to fill in.', saveLabel: 'Add reply',
      validate: W2 => (req(W2, ['title', 'text']) ? null : 'A reply needs a title and the reply text.'),
      save: async W2 => { await commit('r~' + id, { data: J(W2) }); }
    });
  }
  function openCheck() {
    openEditor({
      kind: 'check', title: 'Monthly announcement', sub: 'Shown on the home page strip and on the Knowledge Check intro', W: clone(CHECK), docId: 'check',
      note: 'Change these three lines each month. Scores are stored per browser per month, so a new month name starts everyone fresh.',
      validate: W2 => (req(W2, ['month', 'announced', 'deadline']) ? null : 'Fill in all three lines.'),
      save: async W2 => { await commit('check', { data: J(W2) }); }
    });
  }
  function openQuiz() {
    openEditor({
      kind: 'quiz', title: 'Edit quiz questions', sub: 'The monthly Knowledge Check', W: clone(QUIZ), ctx: { key: 'questions' }, docId: 'quiz', rootKey: 'questions',
      note: 'Tip: to add a question, duplicate one of the same type and change the wording. The type of a question cannot be changed. For lists of numbers, the first item is 0.',
      validate: W2 => (!W2.length ? 'The quiz needs at least one question.' : W2.some(q => !q.title || !q.type) ? 'Every question needs a title.' : validateQuiz(W2)),
      save: async W2 => { await commit('quiz', { data: J(W2) }); }
    });
  }
  function openPick(kind) {
    const isPop = kind === 'popular';
    openEditor({
      kind, title: isPop ? 'Edit Most used' : 'Edit example questions', sub: isPop ? 'The cards under the search box on the home page. Six fit best.' : 'The suggestion chips under the search box', W: isPop ? POPULAR.slice() : ASK_EXAMPLES.slice(), docId: kind,
      ctx: { key: kind, pick: isPop ? 'sec' : undefined, short: !isPop, itemLabel: isPop ? 'Card' : 'Question' }, rootKey: kind,
      validate: W2 => (W2.length ? null : 'Keep at least one.'),
      save: async W2 => { await commit(kind, { data: J(isPop ? W2 : W2.filter(x => x.trim())) }); }
    });
  }

  /* ---------- structure actions ---------- */
  async function moveSection(id, dir) {
    const e = SEC[id]; if (!e) return; const pid = e.p.id, order = curOrder(pid), i = order.indexOf(id), j = i + dir;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    try { await saveOrder(pid, order, curRemoved(pid)); refresh(); toast('Moved'); } catch (er) { toast(errText(er)); }
  }
  async function deleteSection(id) {
    const e = SEC[id]; if (!e) return; const pid = e.p.id, order = curOrder(pid).filter(x => x !== id), removed = curRemoved(pid);
    if (!removed.includes(id)) removed.push(id);
    try { await saveOrder(pid, order, removed); refresh(); toast('Section deleted'); } catch (er) { toast(errText(er)); }
  }

  /* ---------- events ---------- */
  function setAt(path, fn) {
    const ks = path.split('/').filter(x => x !== '');
    if (!ks.length) return;
    const parent = ks.slice(0, -1).reduce((a, k) => a[k], SES.W), last = ks[ks.length - 1];
    fn(parent, last);
  }
  document.addEventListener('input', e => {
    const t = e.target; if (!SES || !t.dataset || t.dataset.p === undefined || t.hasAttribute('data-eaddblock') || !t.closest('#edrawer')) return;
    const ty = t.dataset.ty; setAt(t.dataset.p, (par, k) => { par[k] = ty === 'n' ? (+t.value || 0) : ty === 'b' ? t.checked : t.value; });
    dirty = true; SES.armedClose = false; if (t.tagName === 'TEXTAREA') { t.rows = Math.min(16, Math.max(2, Math.ceil(t.value.length / 64) + (t.value.split('\n').length - 1))); }
  });
  document.addEventListener('change', e => {
    const t = e.target; if (!SES || !t.closest || !t.closest('#edrawer')) return;
    if (t.matches('select[data-p]:not([data-eaddblock])')) { const ty = t.dataset.ty; setAt(t.dataset.p, (par, k) => { par[k] = ty === 'n' ? +t.value : t.value; }); dirty = true; }
    if (t.matches('input[type=checkbox][data-p]')) { setAt(t.dataset.p, (par, k) => { par[k] = t.checked; }); dirty = true; }
    if (t.matches('[data-eaddblock]') && t.value) {
      const b = BLOCKS.find(x => x[0] === t.value); const list = pget(SES.W, t.dataset.p); list.push(b[2]()); dirty = true; drawBody(true);
      const bb = body(); bb.scrollTop = bb.scrollHeight;
    }
  });
  async function onEditClick(btn) {
    const k = btn.dataset.edit, key = btn.dataset.key;
    if (k === 'sec') return openSection(key, false);
    if (k === 'faq') return openFaq(key);
    if (k === 'pol') return openPol(key);
    if (k === 'reply') return openReply(key);
    if (k === 'newreply') return openNewReply(key);
    if (k === 'check') return openCheck();
    if (k === 'quiz') return openQuiz();
    if (k === 'popular' || k === 'asks') return openPick(k);
    if (k === 'moveup') return moveSection(key, -1);
    if (k === 'movedown') return moveSection(key, 1);
    if (k === 'addsec') { if (key[0] === '@') return openSection(null, true, key.slice(1), -1); const e = SEC[key]; return openSection(null, true, e.p.id, e.n - 1); }
    if (k === 'delsec') {
      if (btn.dataset.armed === '1') { clearTimeout(btn._t); return deleteSection(key); }
      btn.dataset.armed = '1'; const sp = btn.querySelector('span'); const old = sp.textContent; sp.textContent = 'Click again to delete'; btn.classList.add('armed');
      btn._t = setTimeout(() => { btn.dataset.armed = ''; sp.textContent = old; btn.classList.remove('armed'); }, 4000);
    }
  }
  document.addEventListener('click', async e => {
    const eb = e.target.closest('[data-edit]');
    if (eb) { e.preventDefault(); e.stopPropagation(); onEditClick(eb); return; }
    if (e.target.closest('#edit-toggle')) { toggle(); return; }
    if (e.target.closest('#ebar-done')) { toggle(false); return; }
    if (!drawer || !e.target.closest('#edrawer')) return;
    if (e.target.closest('[data-eclose]')) { closeEditor(); return; }
    const op = e.target.closest('[data-eop]');
    if (op && SES) {
      const path = op.dataset.p, i = +op.dataset.i, list = path === '' ? SES.W : pget(SES.W, path);
      const o = op.dataset.eop;
      if (o === 'up' && i > 0) [list[i - 1], list[i]] = [list[i], list[i - 1]];
      else if (o === 'down' && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
      else if (o === 'dup') { const c = clone(list[i]); const fix = v => { if (v && typeof v === 'object' && !Array.isArray(v) && typeof v.id === 'string' && v.t !== 'flow') v.id = rid(); }; fix(c); list.splice(i + 1, 0, c); }
      else if (o === 'del') list.splice(i, 1);
      else if (o === 'add' && SES.kind === 'quiz' && path === '') list.push(clone(list[list.length - 1]));
      else if (o === 'add') { const last = list.length ? list[list.length - 1] : ''; const nv = blank(last); if (nv && typeof nv === 'object' && !Array.isArray(nv) && 'id' in last) nv.id = rid(); list.push(nv); }
      dirty = true; drawBody(true); return;
    }
    if (e.target.closest('#ed-save') && SES && !saving) {
      const bad = SES.validate ? SES.validate(SES.W) : null;
      if (bad) { msg(bad, true); return; }
      saving = true; document.getElementById('ed-save').disabled = true; msg('Saving…');
      try { await SES.save(SES.W); dirty = false; closeEditor(true); refresh(); toast('Saved. It is live for everyone.'); }
      catch (er) { console.error(er); msg(errText(er), true); document.getElementById('ed-save').disabled = false; }
      saving = false; return;
    }
    if (e.target.closest('#ed-reset') && SES && SES.reset) {
      const b = document.getElementById('ed-reset');
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Click again to confirm'; setTimeout(() => { b.dataset.armed = ''; b.textContent = 'Reset to original'; }, 4000); return; }
      try { await SES.reset(); closeEditor(true); refresh(); toast('Back to the original.'); } catch (er) { msg(errText(er), true); }
      return;
    }
    if (e.target.closest('#ed-del') && SES && SES.del) {
      const b = document.getElementById('ed-del');
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Click again to delete'; setTimeout(() => { b.dataset.armed = ''; if (SES && SES.del) b.textContent = SES.del.label; }, 4000); return; }
      try { await SES.del.run(); closeEditor(true); refresh(); toast('Deleted.'); } catch (er) { msg(errText(er), true); }
    }
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && SES) closeEditor(); });

  /* ---------- edit mode switch ---------- */
  function toggle(on) {
    EDIT.on = on === undefined ? !EDIT.on : on;
    document.body.classList.toggle('editing', EDIT.on);
    const b = document.getElementById('edit-toggle'); if (b) { b.querySelector('span').textContent = EDIT.on ? 'Done editing' : 'Edit site'; b.classList.toggle('on', EDIT.on); }
    const bar = document.getElementById('ebar'); if (bar) bar.hidden = !EDIT.on;
    if (!EDIT.on) closeEditor(true);
    const y = window.pageYOffset || 0; render(); window.scrollTo(0, y);
  }
  function mountSwitch() {
    const nav = document.querySelector('.nav-actions'); if (!nav || document.getElementById('edit-toggle')) return;
    const b = document.createElement('button'); b.type = 'button'; b.id = 'edit-toggle'; b.className = 'btn btn-sm btn-ghost etoggle';
    b.innerHTML = ic('edit', 14) + '<span>Edit site</span>'; nav.insertBefore(b, nav.firstChild);
    const bar = document.createElement('div'); bar.id = 'ebar'; bar.className = 'ebar'; bar.hidden = true;
    bar.innerHTML = `<div class="inner"><span>${ic('edit', 14)} <b>Editing mode.</b> Use the blue Edit buttons. Saved changes are live for everyone straight away.</span><button type="button" class="btn btn-sm" id="ebar-done">Done editing</button></div>`;
    const hdr = document.querySelector('header.nav'); hdr.parentNode.insertBefore(bar, hdr.nextSibling);
  }

  /* ---------- start ---------- */
  async function init() {
    try {
      if (typeof claude === 'undefined' || !claude.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db) return;
      DB = db;
      EDIT.can = !!(user && (await user.canEdit()));
      if (EDIT.can) mountSwitch();
      db.collection('kb').onSnapshot(snap => {
        const ov = {}; snap.docs.forEach(d => { const v = d.data(); if (v) ov[d.id] = v; });
        const sig = sigOf(ov); if (sig === lastSig) return;
        lastSig = sig; OV = ov;
        if (state.route === 'quiz' && QS.phase === 'q') { pending = true; return; }
        refresh();
      }, err => { console.warn('live content unavailable', err && err.code); });
    } catch (e) { console.warn('live edit unavailable', e); }
  }
  init();
  return { beforeRender, applyAll, _ov: () => OV };
})();

try { if (typeof claude === 'undefined' || !claude.use) { LIVE.applyAll({ 'o~warranty': { order: JSON.stringify(['w-path','w-overview','w-repair-cover','w-repair-excluded','w-repair-terms','w-repair-journey','w-repair-centers','w-repair-cant','w-repair-say','w-defect','w-types','w-after3','w-examples']), removed: '[]' } }); render(); } } catch (e) { }
